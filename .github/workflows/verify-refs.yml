name: verify-refs

on:
  pull_request:
    paths:
      - 'agents/**/*.toml'
      - 'dreamers/**/*.md'
      - 'skills/**/*.md'
      - 'scripts/sync-refs.sh'
      - 'scripts/Test-DreamersCodex.sh'
      - '.github/workflows/verify-refs.yml'
  push:
    branches: [main]
    paths:
      - 'agents/**/*.toml'
      - 'dreamers/**/*.md'
      - 'skills/**/*.md'
      - 'scripts/sync-refs.sh'
      - 'scripts/Test-DreamersCodex.sh'
      - '.github/workflows/verify-refs.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Validate Dreamers Codex package
        shell: bash
        run: scripts/Test-DreamersCodex.sh
