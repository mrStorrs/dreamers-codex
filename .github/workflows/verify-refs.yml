name: verify-dreamers-package

on:
  pull_request:
    paths:
      - 'agents/**/*.toml'
      - 'dreamers/**/*.md'
      - 'skills/**/*.md'
      - '.codex-plugin/plugin.json'
      - '.github/catalog.json'
      - 'README.md'
      - 'Install-DreamersCodex.sh'
      - 'Install-DreamersCodex.ps1'
      - 'Remove-DreamersCodex.ps1'
      - 'scripts/**'
      - '.github/workflows/verify-refs.yml'
  push:
    branches: [main]
    paths:
      - 'agents/**/*.toml'
      - 'dreamers/**/*.md'
      - 'skills/**/*.md'
      - '.codex-plugin/plugin.json'
      - '.github/catalog.json'
      - 'README.md'
      - 'Install-DreamersCodex.sh'
      - 'Install-DreamersCodex.ps1'
      - 'Remove-DreamersCodex.ps1'
      - 'scripts/**'
      - '.github/workflows/verify-refs.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Validate Dreamers Codex package with Bash
        shell: bash
        run: scripts/Test-DreamersCodex.sh
      - name: Validate Dreamers Codex package and migration with PowerShell
        shell: pwsh
        run: ./scripts/Test-DreamersCodex.ps1
